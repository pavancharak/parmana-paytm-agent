openapi: 3.0.3
info:
  title: Parmana Paytm Agent API
  version: 0.1.0
  description: Agent facing refund API. Every refund is authorized by Parmana, and only Parmana releases it to Paytm.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service healthy
  /agent/refunds:
    post:
      operationId: proposeRefund
      summary: Propose a customer refund
      description: The agent proposes the refund. This service reads the customer-refund version in effect from Parmana and calls Parmana /execute. When Parmana approves it releases the refund to Paytm itself, exactly once; this endpoint never calls Paytm and returns the result from Parmana's Trust Record.
      security:
        - AgentBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundProposal'
      responses:
        '200':
          description: Parmana approved and released the refund, and Paytm reported success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovedRefund'
        '502':
          description: Parmana approved and released the refund, but Paytm did not report success; reconcile before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovedRefund'
        '401':
          description: Missing or invalid agent API key
        '403':
          description: Parmana denied the refund; Paytm was not invoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeniedRefund'
        '500':
          description: Fail-closed integration error
components:
  securitySchemes:
    AgentBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: Inbound API credential for the agent-facing endpoint. This authenticates the caller; Parmana remains the authorization authority for refunds.
  schemas:
    RefundSignals:
      type: object
      required: [refundEligible, managerApproved, fraudCheckPassed, maximumRefundAmount]
      properties:
        refundEligible: { type: boolean }
        managerApproved: { type: boolean }
        fraudCheckPassed: { type: boolean }
        maximumRefundAmount: { type: number, exclusiveMinimum: 0 }
    RefundProposal:
      type: object
      required: [orderId, txnId, amount, signals]
      properties:
        orderId: { type: string, minLength: 1 }
        txnId: { type: string, minLength: 1 }
        refId: { type: string, minLength: 1 }
        amount: { type: string, pattern: '^[0-9]+(\\.[0-9]{1,2})?$' }
        reason: { type: string }
        signals:
          $ref: '#/components/schemas/RefundSignals'
        approvalArtifact:
          type: object
          description: A manager's signed approval, needed above 10000. Forwarded unchanged to Parmana as signals.approvalArtifact with managerApproved true; Parmana verifies it.
    ApprovedRefund:
      type: object
      required: [decision, authorizationId, transactionId, refund]
      properties:
        decision: { type: string, enum: [APPROVED] }
        authorizationId: { type: string }
        transactionId: { type: string }
        refund:
          type: object
          description: What Paytm reported, read from the execution evidence in Parmana's signed Trust Record.
          required: [success]
          properties:
            success: { type: boolean }
            refId: { type: string, description: The refId Paytm saw, derived by Parmana from orderId and txnId }
            resultStatus: { type: string }
            resultCode: { type: string }
    DeniedRefund:
      type: object
      required: [decision, authorizationId, transactionId, reason]
      properties:
        decision: { type: string, enum: [DENIED] }
        authorizationId: { type: string }
        transactionId: { type: string }
        reason: { type: string }
